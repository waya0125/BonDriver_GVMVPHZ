name: Build BonDriver_GVMVPHZ

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
          - arch: x86
            cmake_arch: Win32

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (${{ matrix.arch }})
        run: cmake -B build-${{ matrix.arch }} -A ${{ matrix.cmake_arch }}

      - name: Build (${{ matrix.arch }})
        run: cmake --build build-${{ matrix.arch }} --config Release

      - name: Package (${{ matrix.arch }})
        shell: pwsh
        run: |
          $dir = "BonDriver_GVMVPHZ-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "build-${{ matrix.arch }}\Release\BonDriver_GVMVPHZ.dll" "$dir\"
          Copy-Item "build-${{ matrix.arch }}\Release\bon_test.exe" "$dir\"
          Copy-Item "README.md", "LICENSE" "$dir\"
          Compress-Archive -Path "$dir\*" -DestinationPath "$dir.zip" -Force

      - name: Upload artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: BonDriver_GVMVPHZ-${{ matrix.arch }}
          path: BonDriver_GVMVPHZ-${{ matrix.arch }}.zip

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
